# Sitio estático sin build: se publica la raíz del repositorio tal cual.

[build]
  publish = "."
  command = ""

# Despliegue provisional: no debe indexarse.
# Al pasar al dominio definitivo, ELIMINAR el X-Robots-Tag de este bloque.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# La documentación interna no se sirve (equivalente a .vercelignore).
[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
